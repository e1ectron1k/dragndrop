name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18 (стабильная для webpack 5)
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.4' # Конкретная стабильная версия
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          # Проверяем, что webpack-cli доступен
          ./node_modules/.bin/webpack --version || echo "Webpack check"

      - name: Build project
        run: |
          # Используем npx для гарантии, что используется локальный webpack
          npx webpack --mode production
          
      - name: Verify build
        run: |
          echo "Содержимое dist/:"
          ls -la dist/
          if [ -f "dist/index.html" ]; then
            echo "✅ index.html найден"
          else
            echo "❌ index.html не найден!"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true